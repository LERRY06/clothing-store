<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Продукт — LÉVIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

<!-- =========================================
     NAVIGATION
========================================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo">
        LÉVIA
    </a>

    <nav class="nav-links">
        <a href="index.html">Начало</a>
        <a href="women.html">Дамски</a>
        <a href="men.html">Мъжки</a>
        <a href="new-collection.html">Нова колекция</a>
        <a href="contact.html">Контакти</a>
    </nav>

    <div class="nav-actions">

        <button
            class="search-button"
            aria-label="Търсене"
            type="button">
            ⌕
        </button>

        <button
            aria-label="Любими"
            type="button">
            ♡
        </button>

        <button
            aria-label="Количка"
            type="button">
            🛒
        </button>

        <button
            class="menu-toggle"
            aria-label="Отвори менюто"
            aria-expanded="false"
            type="button">
            ☰
        </button>
    </div>
</header>

<!-- =========================================
     SEARCH
========================================= -->

<div
    class="search-panel"
    id="searchPanel">

    <input
        type="text"
        id="searchInput"
        placeholder="Търси продукт..."
        autocomplete="off">

    <button
        id="closeSearch"
        type="button"
        aria-label="Затвори">
        ✕
    </button>
</div>

<!-- =========================================
     PRODUCT
========================================= -->

<main>
    <section class="product-page">

        <!-- PRODUCT IMAGE -->
        <div class="product-large-image">
            <img
                id="productImage"
                src=""
                alt="">
        </div>

        <!-- PRODUCT DETAILS -->
        <div class="product-details">
            <p
                class="product-category"
                id="productCategory">
            </p>

            <h1 id="productName">
            </h1>

            <p
                class="product-page-price"
                id="productPrice">
            </p>

            <p
                class="product-description"
                id="productDescription">
            </p>

            <!-- SIZE -->
            <div class="size-section">
                <div class="size-title">
                    <span>
                        Размер
                    </span>
                    <span>
                        Таблица с размери
                    </span>
                </div>

                <div
                    class="sizes"
                    id="productSizes">
                </div>
            </div>

            <!-- ADD TO CART -->

            <button
                class="add-to-cart"
                type="button">
                Добави в количката
            </button>

            <!-- PRODUCT INFORMATION -->
            <div class="product-info-list">
                <div>
                    <span>
                        Материал
                    </span>
                    <span id="productMaterial"></span>
                </div>

                <div>
                    <span>
                        Доставка
                    </span>
                    <span>
                        2–4 работни дни
                    </span>
                </div>

                <div>
                    <span>
                        Връщане
                    </span>
                    <span>
                        14 дни
                    </span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer">

    <div class="footer-logo">
        LÉVIA
    </div>

    <div class="footer-links">

        <a href="#">
            За нас
        </a>

        <a href="#">
            Доставка
        </a>

        <a href="#">
            Връщане
        </a>

        <a href="contact.html">
            Контакти
        </a>
    </div>

    <p>
        © 2026 LÉVIA. Всички права запазени.
    </p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>

</body>
</html>
